{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'core/css/styles.css' %}">
    <title>{% block title %}{{ restoration_site_setting.company_name }}{% endblock %}</title>
</head>
<body>
    <header class="site-header">
        <div class="container header_inner">
            <a href="/" class="logo">{{ restoration_site_setting.company_name}}</a>
            <nav class="main-nav">
                <a href="#services">Services</a>
                <a href="#">Media</a>
                <a href="#">Blogs</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
                <div class="nav-social">
                    <a href="{{ restoration_site_setting.phone_number }}" class="social-link">
                        <i class="bi bi-telephone"></i>
                    </a>
                    <a href="{{ restoration_site_setting.email }}" class="social-link">
                        <i class="bi bi-envelope"></i>
                    </a>
                    <a href="{{ restoration_site_setting.instagram_url }}" class="social-link">
                        <i class="bi bi-instagram"></i>
                    </a>
                    <a href="{{ restoration_site_setting.facebook_url }}" class="social-link">
                        <i class="bi bi-facebook"></i>
                    </a>
                    <a href="{{ restoration_site_setting.twitter_url }}" class="social-link">
                        <i class="bi bi-twitter-x"></i>
                    </a>
                    <a href="{{ restoration_site_setting.linkedin_url }}" class="social-link">
                        <i class="bi bi-linkedin"></i>
                    </a>
                </div>
            </nav>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>
    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
    <script src="{% static 'core/js/main.js' %}"></script>
</body>
</html>
